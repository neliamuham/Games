<!doctype html><html lang='ru'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Своя игра</title>
<style>/* styles omitted compact */:root{--bg:#0d1020;--p:#1a1f38;--p2:#242a4a;--g:#f7c948;--t:#f5f7ff;--m:#9aa3c7;--ok:#2ecc71;--bad:#ff5c7a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:radial-gradient(circle at top,#1b2248,var(--bg));color:var(--t)}.app{max-width:1450px;margin:auto;padding:14px}.top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px}.teams{display:flex;gap:10px;flex-wrap:wrap}.team{background:var(--p);padding:10px;border-radius:12px;min-width:210px}.team input{width:100%;background:#11162d;border:1px solid #3a4372;color:#fff;padding:6px;border-radius:8px}.score{font-size:30px;font-weight:800;text-align:center}.ops{display:flex;gap:6px;justify-content:center}.ops button,.btn{background:#2d3663;border:1px solid #42518c;color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.board{margin-top:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.category,.qcell{position:relative;border-radius:10px;text-align:center}.category{background:#172146;border:1px solid #3554a0;padding:10px;font-weight:800}.qcell{background:#1b285b;border:1px solid #3d58ab;min-height:96px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--g);cursor:pointer}.qcell.played{opacity:.35}.edit-ico{position:absolute;right:8px;top:6px;opacity:0;cursor:pointer;padding:2px 4px;border-radius:6px;background:#0008}.qcell:hover .edit-ico,.category:hover .edit-ico{opacity:1}@media (hover:none){.edit-ico{opacity:1}}.modal,.screen{position:fixed;inset:0;background:#090d1bdd;display:none;align-items:center;justify-content:center;z-index:9;padding:15px}.open{display:flex}.card{width:min(980px,97vw);max-height:92vh;overflow:auto;background:var(--p);border-radius:14px;padding:14px;border:1px solid #3a4a87}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;background:#101733;border:1px solid #39467f;color:#fff;padding:8px;border-radius:8px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden-answer{filter:blur(6px)}.progress-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.mini{background:#121936;border:1px solid #314182;border-radius:6px;padding:6px;text-align:center;cursor:pointer}.done{color:var(--ok)}.empty{color:var(--bad)}.current{outline:2px solid var(--g)}.qscreen{width:100%;height:100%;background:linear-gradient(180deg,#151e47,#0b1028);padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}.qtop{display:flex;justify-content:space-between;width:100%}.qmeta{font-size:30px;font-weight:800}.optGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(1200px,95vw)}.opt{background:#1d2a60;padding:18px;border-radius:12px;font-size:30px;text-align:center}.answerBlock{display:none;text-align:center;animation:f .45s}.answerBlock.show{display:block}.correct{font-size:46px;color:#91ff9f;font-weight:900}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1}}.final{width:min(900px,96vw);background:var(--p2);padding:22px;border-radius:18px;text-align:center}.winner{font-size:54px;color:var(--g);font-weight:900}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #3d4e8f}</style></head><body>
<div class='app'><h1>🎯 Своя игра — Party Quiz</h1><div class='top'><div class='teams' id='teams'></div><div class='actions'><button class='btn' id='resetGame'>Сбросить игру</button><button class='btn' id='exportJson'>Экспорт JSON</button><button class='btn' id='importJson'>Импорт JSON</button><input type='file' id='importFile' hidden accept='application/json'></div><div></div></div><div class='board' id='board'></div></div>
<div class='modal' id='editorModal'><div class='card' id='editorCard'></div></div><div class='screen' id='questionScreen'><div class='qscreen' id='qscreen'></div></div><div class='screen' id='finalScreen'><div class='final' id='finalCard'></div></div>
<script>
const values=[100,200,300,400,500],idx=(c,r)=>r*5+c,normQ=()=>({text:'',options:['','','',''],correct:'',image:'',video:''});
const defaultData=()=>({categories:['Категория 1','Категория 2','Категория 3','Категория 4','Категория 5'],questions:Array.from({length:25},normQ),played:Array(25).fill(false),teams:[{name:'Команда 1',score:0},{name:'Команда 2',score:0},{name:'Команда 3',score:0}]});
function load(){try{let d=JSON.parse(localStorage.getItem('partyQuizData'));if(d){d.categories=d.categories||defaultData().categories;d.questions=(d.questions||[]).map(q=>Object.assign(normQ(),q));while(d.questions.length<25)d.questions.push(normQ());d.played=d.played||Array(25).fill(false);d.teams=d.teams||defaultData().teams;return d}}catch(e){}return defaultData()}
let state=load(),currentIndex=0,timerId,timeLeft=60,answered=false;const save=()=>localStorage.setItem('partyQuizData',JSON.stringify(state));
function renderTeams(){const el=teams;el.innerHTML='';state.teams.forEach((t,i)=>{const v=values[currentIndex/5|0],d=document.createElement('div');d.className='team';d.innerHTML=`<input class='tname' data-i='${i}' value='${t.name}'><div class='score'>${t.score}</div><div class='ops'><button data-op='minus' data-i='${i}'>-${v}</button><button data-op='plus' data-i='${i}'>+${v}</button></div>`;el.append(d)});el.querySelectorAll('.tname').forEach(i=>i.oninput=e=>{state.teams[e.target.dataset.i].name=e.target.value;save()});el.querySelectorAll('button[data-op]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,v=values[currentIndex/5|0];state.teams[i].score+=b.dataset.op==='plus'?v:-v;save();renderTeams();checkFinal()})}
function renderBoard(){board.innerHTML='';for(let c=0;c<5;c++){let d=document.createElement('div');d.className='category';d.innerHTML=`<span contenteditable='true' data-c='${c}'>${state.categories[c]}</span><span class='edit-ico'>✏️</span>`;board.append(d)}for(let r=0;r<5;r++)for(let c=0;c<5;c++){let i=idx(c,r),d=document.createElement('div');d.className='qcell'+(state.played[i]?' played':'');d.innerHTML=`${values[r]}<span class='edit-ico' title='Редактировать'>⚙️</span>`;d.onclick=e=>{if(e.shiftKey){openEditor(i);return}const q=state.questions[i];if(!q.text.trim()&&!q.options.some(o=>o.trim())&&!q.correct.trim()&&!q.image.trim()&&!q.video.trim()){openEditor(i);return}openQuestion(i)};d.ondblclick=e=>{e.preventDefault();openEditor(i)};d.oncontextmenu=e=>{e.preventDefault();openEditor(i)};d.querySelector('.edit-ico').onclick=e=>{e.stopPropagation();openEditor(i)};board.append(d)}board.querySelectorAll('[contenteditable]').forEach(e=>e.oninput=ev=>{state.categories[ev.target.dataset.c]=ev.target.innerText.trim();save()})}
function openEditor(i){currentIndex=i;let q=state.questions[i],c=i%5,r=i/5|0;editorCard.innerHTML=`<h2>Редактор</h2><div class='grid2'><div><select id='ecat'>${state.categories.map((x,j)=>`<option value='${j}' ${j===c?'selected':''}>${x||('Категория '+(j+1))}</option>`).join('')}</select></div><div><select id='eval'>${values.map((v,j)=>`<option value='${j}' ${j===r?'selected':''}>${v}</option>`).join('')}</select></div></div><textarea id='qtext'>${q.text}</textarea><div class='answers'>${[0,1,2,3].map(k=>`<input id='opt${k}' value='${q.options[k]||''}' placeholder='Вариант ${k+1}'>`).join('')}</div><input id='qcorrect' class='hidden-answer' value='${q.correct}' placeholder='Правильный ответ'><button class='btn' id='showAns'>Показать ответ</button><input id='qimg' value='${q.image}' placeholder='URL картинки'><input type='file' id='qimgf' accept='image/*'><input id='qvideo' value='${q.video}' placeholder='YouTube URL'><div class='progress-mini' id='mini'></div><button class='btn' id='closeEditor'>Закрыть</button>`;
const sv=()=>{let q=state.questions[currentIndex];q.text=qtext.value;q.options=[0,1,2,3].map(k=>document.getElementById('opt'+k).value);q.correct=qcorrect.value;q.image=qimg.value;q.video=qvideo.value;save()};editorCard.oninput=sv;showAns.onclick=()=>qcorrect.classList.toggle('hidden-answer');qimgf.onchange=e=>{let f=e.target.files[0];if(!f)return;let fr=new FileReader();fr.onload=v=>{qimg.value=v.target.result;sv()};fr.readAsDataURL(f)};ecat.onchange=eval.onchange=()=>{sv();let ni=idx(+ecat.value,+eval.value);if(ni!==currentIndex){[state.questions[ni],state.questions[currentIndex]]=[state.questions[currentIndex],state.questions[ni]];currentIndex=ni;save();openEditor(ni)}};for(let rr=0;rr<5;rr++)for(let cc=0;cc<5;cc++){let ii=idx(cc,rr),m=document.createElement('div');m.className='mini '+(state.questions[ii].text.trim()?'done':'empty')+(ii===currentIndex?' current':'');m.textContent=state.questions[ii].text.trim()?'✓':'✗';m.onclick=()=>{sv();openEditor(ii)};mini.append(m)}closeEditor.onclick=closeAll;editorModal.classList.add('open')}
const yid=u=>(u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/)||[])[1]||'';
function openQuestion(i){currentIndex=i;answered=false;timeLeft=60;let q=state.questions[i],cat=state.categories[i%5],val=values[i/5|0],id=yid(q.video);qscreen.innerHTML=`<div class='qtop'><div class='qmeta'>${cat} — ${val}</div><div id='timerWrap'><svg width='88' height='88' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' stroke='#3d4e8f' stroke-width='10' fill='none'/><circle id='prog' cx='50' cy='50' r='44' stroke='#6ec8ff' stroke-width='10' fill='none' transform='rotate(-90 50 50)' stroke-dasharray='276.46'/></svg><div id='ttext'>60</div></div></div><div style='font-size:42px;text-align:center'>${q.text||'(Вопрос не заполнен)'}</div><div class='optGrid' id='opts'>${q.options.filter(Boolean).map(o=>`<div class='opt'>${o}</div>`).join('')}</div><div class='answerBlock' id='ans'><div class='correct'>${q.correct||'—'}</div>${q.image?`<img style='max-width:90vw;max-height:45vh' src='${q.image}'>`:''}${id?`<iframe width='900' height='500' src='https://www.youtube.com/embed/${id}' allowfullscreen></iframe>`:''}</div><button class='btn' id='showAnswer'>Показать ответ</button><button class='btn' id='backBoard'>‹ Назад к игровому полю</button><div class='teams' id='award'></div>`;renderAwardButtons();startTimer();showAnswer.onclick=showAnswerFn;backBoard.onclick=closeAll;questionScreen.classList.add('open')}
function renderAwardButtons(){award.innerHTML='';let v=values[currentIndex/5|0];state.teams.forEach((t,i)=>{let d=document.createElement('div');d.className='team';d.innerHTML=`<div>${t.name}</div><div class='ops'><button data-op='minus' data-i='${i}'>-${v}</button><button data-op='plus' data-i='${i}'>+${v}</button></div>`;award.append(d)});award.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;state.teams[i].score+=b.dataset.op==='plus'?v:-v;save();renderTeams();renderAwardButtons();checkFinal()})}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(answered)return;timeLeft=Math.max(0,timeLeft-1);let p=document.getElementById('prog'),t=document.getElementById('ttext');if(!p)return;p.style.strokeDashoffset=(276.46*(1-timeLeft/60)).toFixed(2);p.style.stroke=timeLeft<=10?'#ff3d3d':'#6ec8ff';t.textContent=timeLeft;if(!timeLeft)clearInterval(timerId)},1000)}
function showAnswerFn(){answered=true;clearInterval(timerId);timerWrap.style.display='none';opts.style.display='none';ans.classList.add('show');state.played[currentIndex]=true;save();renderBoard();checkFinal()}
function checkFinal(){if(state.played.every(Boolean)){let max=Math.max(...state.teams.map(t=>t.score)),wins=state.teams.filter(t=>t.score===max).map(t=>t.name).join(' и ');finalCard.innerHTML=`<h2>🏆 Игра завершена!</h2><div class='winner'>${wins}</div><div>${max} очков</div><table><tr><th>#</th><th>Команда</th><th>Счёт</th></tr>${[...state.teams].sort((a,b)=>b.score-a.score).map((t,i)=>`<tr><td>${i+1}</td><td>${t.name}</td><td>${t.score}</td></tr>`).join('')}</table>`;finalScreen.classList.add('open')}}
function closeAll(){document.querySelectorAll('.modal,.screen').forEach(e=>e.classList.remove('open'));clearInterval(timerId);renderTeams();renderBoard()}
window.onkeydown=e=>e.key==='Escape'&&closeAll();resetGame.onclick=()=>{if(confirm('Сбросить игру и счёт?')){state.played=Array(25).fill(false);state.teams.forEach(t=>t.score=0);save();closeAll()}};
exportJson.onclick=()=>{let txt=JSON.stringify(state,null,2);navigator.clipboard&&navigator.clipboard.writeText(txt);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='party-quiz.json';a.click()};importJson.onclick=()=>importFile.click();importFile.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=v=>{try{state=JSON.parse(v.target.result);state.questions=(state.questions||[]).map(q=>Object.assign(normQ(),q));while(state.questions.length<25)state.questions.push(normQ());state.played=state.played||Array(25).fill(false);state.categories=state.categories||defaultData().categories;state.teams=state.teams||defaultData().teams;save();closeAll()}catch{alert('Некорректный JSON')}};r.readAsText(f)};
renderTeams();renderBoard();
</script></body></html>
